name: Nightly
on:
  schedule:
    - cron: "0 21 * * *" # 02:30 IST
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup-and-restore-drill:
    # Production dump -> R2 -> restore into a throwaway container -> per-table row counts compared.
    # An unconfigured environment fails the job loudly: a silent skip would mean no backups.
    runs-on: ubuntu-latest
    environment: backups
    env:
      DRILL_PG_IMAGE: postgres:18-alpine # keep equal to the Supabase Postgres major (owner to confirm)
    steps:
      - uses: actions/checkout@v5
      - name: Dump production
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          test -n "$BACKUP_DATABASE_URL"
          mkdir -p out
          bash infra/backup/drill.sh --dump "$BACKUP_DATABASE_URL" out
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$R2_ENDPOINT"
          for f in out/swastik-*.dump out/swastik-*.dump.counts; do
            aws s3 cp "$f" "s3://swastik-backups/$(basename "$f")" --endpoint-url "$R2_ENDPOINT"
          done
      - name: Restore drill
        run: |
          pw=$(openssl rand -hex 8)
          docker run -d --name drill-target -e POSTGRES_PASSWORD="$pw" -p 127.0.0.1:5433:5432 "$DRILL_PG_IMAGE"
          for _ in $(seq 1 60); do docker exec drill-target pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1 && break; sleep 1; done
          sleep 2
          bash infra/backup/drill.sh --restore-only out/swastik-*.dump "postgresql://postgres:${pw}@127.0.0.1:5433/postgres"
  mutation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: apps/api/go.mod, cache-dependency-path: apps/api/go.sum }
      - name: Gremlins on money packages
        working-directory: apps/api
        run: |
          if [ -d internal/settlement ]; then
            go install github.com/go-gremlins/gremlins/cmd/gremlins@latest
            gremlins unleash --threshold-efficacy 85 ./internal/settlement ./internal/ledger
          else echo "No money packages yet."; fi
  scheduler-soak:
    # SC-001: 30 simulated days, 100 clients, 10 IPOs, random duplicate/overlapping/skipped ticks and
    # crashes. The seed changes every night; a failure log prints it so the run can be replayed
    # with SWASTIK_SOAK_SEED=<n>. Needs Docker (testcontainers), which ubuntu-latest provides.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: apps/api/go.mod, cache-dependency-path: apps/api/go.sum }
      - name: Scheduler soak (SC-001)
        working-directory: apps/api
        run: SWASTIK_SOAK=full SWASTIK_SOAK_SEED=${{ github.run_id }} go test -race -run TestSoak_SC_001 -timeout 20m -v ./internal/scheduler/...
