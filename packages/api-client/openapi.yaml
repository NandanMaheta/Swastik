components:
  schemas:
    AdminIPO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AdminIPO.json
          format: uri
          readOnly: true
          type: string
        apply_flag:
          enum:
            - APPLY
            - DO_NOT_APPLY
          type:
            - string
            - "null"
        created_at:
          format: date-time
          type: string
        dates:
          $ref: "#/components/schemas/IPODates"
        eligible:
          description: published and APPLY
          type: boolean
        ever_published:
          type: boolean
        flag_note:
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        issue_price_paise:
          format: int64
          type:
            - integer
            - "null"
        issue_size_paise:
          format: int64
          type:
            - integer
            - "null"
        last_synced_at:
          format: date-time
          type:
            - string
            - "null"
        lead_managers:
          items:
            type: string
          type:
            - array
            - "null"
        lot_size:
          format: int32
          type:
            - integer
            - "null"
        min_application_paise:
          description: lot x final price, else lot x band cap
          format: int64
          type:
            - integer
            - "null"
        name:
          type: string
        nse_symbol:
          type:
            - string
            - "null"
        offer_document_url:
          type:
            - string
            - "null"
        price_band_cap_paise:
          format: int64
          type:
            - integer
            - "null"
        price_band_floor_paise:
          format: int64
          type:
            - integer
            - "null"
        published:
          type: boolean
        registrar:
          type:
            - string
            - "null"
        segments:
          items:
            type: string
          type:
            - array
            - "null"
        source:
          examples:
            - manual
          type: string
        source_ref:
          type:
            - string
            - "null"
        status:
          enum:
            - UPCOMING
            - OPEN
            - CLOSED
            - ALLOTMENT_OUT
            - LISTED
            - SETTLED
          type: string
        status_changed_at:
          format: date-time
          type: string
        status_source:
          enum:
            - schedule
            - admin
            - settlement
          type: string
        updated_at:
          format: date-time
          type: string
        version:
          format: int32
          type: integer
      required:
        - apply_flag
        - flag_note
        - eligible
        - published
        - ever_published
        - status_source
        - status_changed_at
        - source
        - source_ref
        - last_synced_at
        - version
        - created_at
        - id
        - name
        - segments
        - nse_symbol
        - issue_size_paise
        - price_band_floor_paise
        - price_band_cap_paise
        - issue_price_paise
        - lot_size
        - min_application_paise
        - dates
        - registrar
        - lead_managers
        - offer_document_url
        - status
        - updated_at
      type: object
    AdminIPOPage:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AdminIPOPage.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/AdminIPO"
          type:
            - array
            - "null"
        next_cursor:
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      type: object
    ChallengeResponse:
      additionalProperties: false
      properties:
        challenge_token:
          description: "dmc_...; send as Authorization: Bearer to the second-factor operations only."
          type: string
        expires_at:
          format: date-time
          type: string
      required:
        - challenge_token
        - expires_at
      type: object
    ChangePasswordRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ChangePasswordRequest.json
          format: uri
          readOnly: true
          type: string
        current_password:
          format: password
          maxLength: 1024
          minLength: 1
          type: string
        new_password:
          description: The password policy is enforced with specific codes.
          format: password
          maxLength: 2048
          minLength: 1
          type: string
      required:
        - current_password
        - new_password
      type: object
    ClientIPO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ClientIPO.json
          format: uri
          readOnly: true
          type: string
        apply_flag:
          enum:
            - APPLY
            - DO_NOT_APPLY
          type:
            - string
            - "null"
        dates:
          $ref: "#/components/schemas/IPODates"
        flag_note:
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        issue_price_paise:
          format: int64
          type:
            - integer
            - "null"
        issue_size_paise:
          format: int64
          type:
            - integer
            - "null"
        lead_managers:
          items:
            type: string
          type:
            - array
            - "null"
        lot_size:
          format: int32
          type:
            - integer
            - "null"
        min_application_paise:
          description: lot x final price, else lot x band cap
          format: int64
          type:
            - integer
            - "null"
        name:
          type: string
        nse_symbol:
          type:
            - string
            - "null"
        offer_document_url:
          type:
            - string
            - "null"
        price_band_cap_paise:
          format: int64
          type:
            - integer
            - "null"
        price_band_floor_paise:
          format: int64
          type:
            - integer
            - "null"
        registrar:
          type:
            - string
            - "null"
        segments:
          items:
            type: string
          type:
            - array
            - "null"
        status:
          enum:
            - UPCOMING
            - OPEN
            - CLOSED
            - ALLOTMENT_OUT
            - LISTED
            - SETTLED
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - apply_flag
        - flag_note
        - id
        - name
        - segments
        - nse_symbol
        - issue_size_paise
        - price_band_floor_paise
        - price_band_cap_paise
        - issue_price_paise
        - lot_size
        - min_application_paise
        - dates
        - registrar
        - lead_managers
        - offer_document_url
        - status
        - updated_at
      type: object
    ClientIPOPage:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ClientIPOPage.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/ClientIPO"
          type:
            - array
            - "null"
        next_cursor:
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      type: object
    DateSuggestion:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DateSuggestion.json
          format: uri
          readOnly: true
          type: string
        allotment_date:
          format: date
          type: string
        close_date:
          format: date
          type: string
        demat_credit_date:
          format: date
          type: string
        listing_date:
          format: date
          type: string
        notice:
          examples:
            - weekdays only; check exchange holidays
          type: string
        notice_code:
          examples:
            - ipo.weekdays_only
          type: string
        refund_date:
          format: date
          type: string
      required:
        - close_date
        - allotment_date
        - refund_date
        - demat_credit_date
        - listing_date
        - notice_code
        - notice
      type: object
    DeviceInfoRequest:
      additionalProperties: false
      properties:
        id:
          description: Installation identity generated by the app.
          format: uuid
          type: string
        name:
          maxLength: 100
          minLength: 1
          type: string
        platform:
          enum:
            - android
            - iphone
            - web
          type: string
      required:
        - id
        - name
        - platform
      type: object
    DeviceItem:
      additionalProperties: false
      properties:
        device_name:
          type: string
        is_current:
          description: Always false in admin listings of another user.
          type: boolean
        last_active_at:
          format: date-time
          type: string
        platform:
          enum:
            - android
            - iphone
            - web
          type: string
        session_id:
          format: uuid
          type: string
        signed_in_at:
          format: date-time
          type: string
      required:
        - session_id
        - device_name
        - platform
        - signed_in_at
        - last_active_at
        - is_current
      type: object
    DeviceList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DeviceList.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/DeviceItem"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    EnrolmentResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EnrolmentResponse.json
          format: uri
          readOnly: true
          type: string
        recovery_codes:
          description: Shown once.
          items:
            type: string
          maxItems: 10
          minItems: 10
          type:
            - array
            - "null"
        session:
          $ref: "#/components/schemas/SessionResponse"
      required:
        - session
        - recovery_codes
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        code:
          description: Stable, language-neutral problem code; UIs translate it.
          examples:
            - validation_failed
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      required:
        - code
      type: object
    FlagBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/FlagBody.json
          format: uri
          readOnly: true
          type: string
        apply_flag:
          enum:
            - APPLY
            - DO_NOT_APPLY
          type:
            - string
            - "null"
        flag_note:
          description: Shown to clients.
          maxLength: 500
          minLength: 1
          type:
            - string
            - "null"
        version:
          format: int32
          minimum: 1
          type: integer
      required:
        - version
        - apply_flag
        - flag_note
      type: object
    IPODates:
      additionalProperties: false
      properties:
        allotment_date:
          format: date
          type:
            - string
            - "null"
        close_date:
          format: date
          type:
            - string
            - "null"
        demat_credit_date:
          format: date
          type:
            - string
            - "null"
        listing_date:
          format: date
          type:
            - string
            - "null"
        open_date:
          format: date
          type:
            - string
            - "null"
        refund_date:
          format: date
          type:
            - string
            - "null"
      required:
        - open_date
        - close_date
        - allotment_date
        - refund_date
        - demat_credit_date
        - listing_date
      type: object
    IPODraft:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/IPODraft.json
          format: uri
          readOnly: true
          type: string
        dates:
          $ref: "#/components/schemas/IPODates"
        issue_price_paise:
          format: int64
          maximum: 1000000000
          minimum: 1
          type:
            - integer
            - "null"
        issue_size_paise:
          format: int64
          maximum: 1000000000000000
          minimum: 1
          type:
            - integer
            - "null"
        lead_managers:
          items:
            maxLength: 200
            minLength: 1
            type: string
          maxItems: 20
          type:
            - array
            - "null"
        lot_size:
          format: int32
          maximum: 1000000
          minimum: 1
          type:
            - integer
            - "null"
        name:
          maxLength: 200
          minLength: 1
          type: string
        nse_symbol:
          pattern: ^[A-Z0-9&-]{1,20}$
          type:
            - string
            - "null"
        offer_document_url:
          format: uri
          maxLength: 2000
          pattern: ^https://
          type:
            - string
            - "null"
        price_band_cap_paise:
          format: int64
          maximum: 1000000000
          minimum: 1
          type:
            - integer
            - "null"
        price_band_floor_paise:
          format: int64
          maximum: 1000000000
          minimum: 1
          type:
            - integer
            - "null"
        registrar:
          maxLength: 200
          minLength: 1
          type:
            - string
            - "null"
        segments:
          description: NSE_MAINBOARD and/or BSE_MAINBOARD. NSE_EMERGE and BSE_SME give ipo.sme_not_allowed; other values or repeats give ipo.invalid_segment.
          items:
            maxLength: 32
            type: string
          maxItems: 4
          minItems: 1
          type:
            - array
            - "null"
      required:
        - name
        - segments
      type: object
    IPOMutationResult:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/IPOMutationResult.json
          format: uri
          readOnly: true
          type: string
        ipo:
          $ref: "#/components/schemas/AdminIPO"
        warnings:
          items:
            $ref: "#/components/schemas/Warning"
          type:
            - array
            - "null"
      required:
        - ipo
        - warnings
      type: object
    IPOReplace:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/IPOReplace.json
          format: uri
          readOnly: true
          type: string
        dates:
          $ref: "#/components/schemas/IPODates"
        issue_price_paise:
          format: int64
          maximum: 1000000000
          minimum: 1
          type:
            - integer
            - "null"
        issue_size_paise:
          format: int64
          maximum: 1000000000000000
          minimum: 1
          type:
            - integer
            - "null"
        lead_managers:
          items:
            maxLength: 200
            minLength: 1
            type: string
          maxItems: 20
          type:
            - array
            - "null"
        lot_size:
          format: int32
          maximum: 1000000
          minimum: 1
          type:
            - integer
            - "null"
        name:
          maxLength: 200
          minLength: 1
          type: string
        nse_symbol:
          pattern: ^[A-Z0-9&-]{1,20}$
          type:
            - string
            - "null"
        offer_document_url:
          format: uri
          maxLength: 2000
          pattern: ^https://
          type:
            - string
            - "null"
        price_band_cap_paise:
          format: int64
          maximum: 1000000000
          minimum: 1
          type:
            - integer
            - "null"
        price_band_floor_paise:
          format: int64
          maximum: 1000000000
          minimum: 1
          type:
            - integer
            - "null"
        registrar:
          maxLength: 200
          minLength: 1
          type:
            - string
            - "null"
        segments:
          items:
            maxLength: 32
            type: string
          maxItems: 4
          minItems: 1
          type:
            - array
            - "null"
        version:
          format: int32
          minimum: 1
          type: integer
      required:
        - version
        - name
        - segments
        - nse_symbol
        - issue_size_paise
        - price_band_floor_paise
        - price_band_cap_paise
        - issue_price_paise
        - lot_size
        - dates
        - registrar
        - lead_managers
        - offer_document_url
      type: object
    LiveOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/LiveOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    MfaVerifyRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/MfaVerifyRequest.json
          format: uri
          readOnly: true
          type: string
        code:
          pattern: ^[0-9]{6}$
          type: string
        recovery_code:
          maxLength: 24
          minLength: 16
          type: string
      type: object
    ReauthWithCode:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ReauthWithCode.json
          format: uri
          readOnly: true
          type: string
        code:
          pattern: ^[0-9]{6}$
          type: string
        password:
          format: password
          maxLength: 1024
          minLength: 1
          type: string
      required:
        - password
        - code
      type: object
    ReauthWithCodeOrRecovery:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ReauthWithCodeOrRecovery.json
          format: uri
          readOnly: true
          type: string
        code:
          pattern: ^[0-9]{6}$
          type: string
        password:
          format: password
          maxLength: 1024
          minLength: 1
          type: string
        recovery_code:
          maxLength: 24
          minLength: 16
          type: string
      required:
        - password
      type: object
    RecoveryCodes:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RecoveryCodes.json
          format: uri
          readOnly: true
          type: string
        recovery_codes:
          items:
            type: string
          maxItems: 10
          minItems: 10
          type:
            - array
            - "null"
      required:
        - recovery_codes
      type: object
    RefreshRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RefreshRequest.json
          format: uri
          readOnly: true
          type: string
        device_id:
          format: uuid
          type: string
        refresh_token:
          description: Mobile only. Omit for web (the cookie is used).
          maxLength: 128
          type: string
      required:
        - device_id
      type: object
    SessionResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SessionResponse.json
          format: uri
          readOnly: true
          type: string
        access_token:
          type: string
        access_token_expires_at:
          format: date-time
          type: string
        idle_expires_at:
          format: date-time
          type: string
        refresh_token:
          description: Only for client_type mobile (drt_...). Web sessions get an HttpOnly cookie instead.
          type: string
        session_expires_at:
          description: Absolute expiry.
          format: date-time
          type: string
        session_id:
          format: uuid
          type: string
        token_type:
          enum:
            - Bearer
          type: string
        user:
          $ref: "#/components/schemas/SessionUser"
      required:
        - access_token
        - token_type
        - access_token_expires_at
        - session_id
        - session_expires_at
        - idle_expires_at
        - user
      type: object
    SessionUser:
      additionalProperties: false
      properties:
        email:
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        role:
          enum:
            - admin
            - client
          type: string
      required:
        - id
        - role
        - name
        - email
      type: object
    SignInRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SignInRequest.json
          format: uri
          readOnly: true
          type: string
        client_type:
          description: "mobile: the refresh token is in the body. web: only in an HttpOnly cookie."
          enum:
            - mobile
            - web
          type: string
        device:
          $ref: "#/components/schemas/DeviceInfoRequest"
        identifier:
          description: Email, or an Indian mobile number in any accepted form.
          maxLength: 320
          minLength: 1
          type: string
        password:
          format: password
          maxLength: 1024
          minLength: 1
          type: string
      required:
        - identifier
        - password
        - client_type
        - device
      type: object
    SignInResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SignInResponse.json
          format: uri
          readOnly: true
          type: string
        challenge:
          $ref: "#/components/schemas/ChallengeResponse"
          description: Present when next_step is mfa_required or mfa_enrolment_required.
        next_step:
          enum:
            - signed_in
            - mfa_required
            - mfa_enrolment_required
          type: string
        session:
          $ref: "#/components/schemas/SessionResponse"
          description: Present when next_step is signed_in.
      required:
        - next_step
      type: object
    Status:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Status.json
          format: uri
          readOnly: true
          type: string
        database:
          description: Database connectivity
          enum:
            - ok
            - unreachable
          type: string
        status:
          description: Overall status
          enum:
            - ok
            - degraded
          type: string
        time:
          description: Server time (UTC)
          format: date-time
          type: string
        version:
          description: Build version
          type: string
      required:
        - status
        - database
        - version
        - time
      type: object
    StatusBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/StatusBody.json
          format: uri
          readOnly: true
          type: string
        reason:
          maxLength: 500
          minLength: 1
          type: string
        status:
          enum:
            - UPCOMING
            - OPEN
            - CLOSED
            - ALLOTMENT_OUT
            - LISTED
            - SETTLED
          type: string
        version:
          format: int32
          minimum: 1
          type: integer
      required:
        - version
        - status
        - reason
      type: object
    TotpCodeRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/TotpCodeRequest.json
          format: uri
          readOnly: true
          type: string
        code:
          pattern: ^[0-9]{6}$
          type: string
      required:
        - code
      type: object
    TotpSecret:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/TotpSecret.json
          format: uri
          readOnly: true
          type: string
        otpauth_uri:
          description: otpauth://totp/Swastik:<email>?secret=...&issuer=Swastik&algorithm=SHA1&digits=6&period=30
          type: string
        secret:
          description: Base32, shown once.
          type: string
      required:
        - secret
        - otpauth_uri
      type: object
    VersionBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/VersionBody.json
          format: uri
          readOnly: true
          type: string
        version:
          format: int32
          minimum: 1
          type: integer
      required:
        - version
      type: object
    Warning:
      additionalProperties: false
      properties:
        code:
          examples:
            - ipo.min_application_out_of_range
          type: string
        detail:
          type: string
        fields:
          items:
            type: string
          type:
            - array
            - "null"
        params:
          additionalProperties:
            format: int64
            type: integer
          type: object
      required:
        - code
        - fields
        - detail
        - params
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
    mfaChallenge:
      bearerFormat: opaque
      scheme: bearer
      type: http
info:
  description: Internal IPO operations platform.
  title: Swastik API
  version: dev
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: health-live
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security: []
      summary: Liveness probe
      tags:
        - Health
  /readyz:
    get:
      operationId: health-ready
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security: []
      summary: Readiness probe (checks the database)
      tags:
        - Health
  /v1/admin/ipos:
    get:
      operationId: ipos-admin-list
      parameters:
        - explode: false
          in: query
          name: status
          schema:
            enum:
              - UPCOMING
              - OPEN
              - CLOSED
              - ALLOTMENT_OUT
              - LISTED
              - SETTLED
            type: string
        - explode: false
          in: query
          name: published
          schema:
            enum:
              - "true"
              - "false"
            type: string
        - explode: false
          in: query
          name: flag
          schema:
            enum:
              - APPLY
              - DO_NOT_APPLY
              - NONE
            type: string
        - description: Open-date month (IST civil), YYYY-MM
          explode: false
          in: query
          name: month
          schema:
            description: Open-date month (IST civil), YYYY-MM
            pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: cursor
          schema:
            maxLength: 200
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIPOPage"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer:
            - admin
      summary: List all IPOs of the org (drafts and published)
      tags:
        - IPOs
    post:
      operationId: ipos-create
      parameters:
        - description: Repeats with the same key return the first result.
          in: header
          name: Idempotency-Key
          schema:
            description: Repeats with the same key return the first result.
            maxLength: 200
            minLength: 8
            pattern: ^[A-Za-z0-9._:-]+$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IPODraft"
        required: true
      responses:
        "200":
          description: Idempotent replay (current state)
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IPOMutationResult"
          description: Created
      security:
        - bearer:
            - admin
      summary: Create an IPO draft (mainboard only)
      tags:
        - IPOs
  /v1/admin/ipos/date-suggestions:
    get:
      operationId: ipos-suggest-dates
      parameters:
        - explode: false
          in: query
          name: close_date
          required: true
          schema:
            format: date
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DateSuggestion"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer:
            - admin
      summary: Suggest allotment, refund, credit and listing dates from a close date (weekdays only; nothing is saved)
      tags:
        - IPOs
  /v1/admin/ipos/{ipoId}:
    delete:
      operationId: ipos-delete
      parameters:
        - description: Repeats with the same key return the first result.
          in: header
          name: Idempotency-Key
          schema:
            description: Repeats with the same key return the first result.
            maxLength: 200
            minLength: 8
            pattern: ^[A-Za-z0-9._:-]+$
            type: string
        - in: path
          name: ipoId
          required: true
          schema:
            format: uuid
            type: string
        - explode: false
          in: query
          name: version
          required: true
          schema:
            format: int32
            minimum: 1
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer:
            - admin
      summary: Delete a never-published draft
      tags:
        - IPOs
    get:
      operationId: ipos-admin-get
      parameters:
        - in: path
          name: ipoId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIPO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer:
            - admin
      summary: Fetch any IPO of the org
      tags:
        - IPOs
    put:
      operationId: ipos-update
      parameters:
        - description: Repeats with the same key return the first result.
          in: header
          name: Idempotency-Key
          schema:
            description: Repeats with the same key return the first result.
            maxLength: 200
            minLength: 8
            pattern: ^[A-Za-z0-9._:-]+$
            type: string
        - in: path
          name: ipoId
          required: true
