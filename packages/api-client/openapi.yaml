components:
  schemas:
    ChallengeResponse:
      additionalProperties: false
      properties:
        challenge_token:
          description: "dmc_...; send as Authorization: Bearer to the second-factor operations only."
          type: string
        expires_at:
          format: date-time
          type: string
      required:
        - challenge_token
        - expires_at
      type: object
    ChangePasswordRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ChangePasswordRequest.json
          format: uri
          readOnly: true
          type: string
        current_password:
          format: password
          maxLength: 1024
          minLength: 1
          type: string
        new_password:
          description: The password policy is enforced with specific codes.
          format: password
          maxLength: 2048
          minLength: 1
          type: string
      required:
        - current_password
        - new_password
      type: object
    DeviceInfoRequest:
      additionalProperties: false
      properties:
        id:
          description: Installation identity generated by the app.
          format: uuid
          type: string
        name:
          maxLength: 100
          minLength: 1
          type: string
        platform:
          enum:
            - android
            - iphone
            - web
          type: string
      required:
        - id
        - name
        - platform
      type: object
    DeviceItem:
      additionalProperties: false
      properties:
        device_name:
          type: string
        is_current:
          description: Always false in admin listings of another user.
          type: boolean
        last_active_at:
          format: date-time
          type: string
        platform:
          enum:
            - android
            - iphone
            - web
          type: string
        session_id:
          format: uuid
          type: string
        signed_in_at:
          format: date-time
          type: string
      required:
        - session_id
        - device_name
        - platform
        - signed_in_at
        - last_active_at
        - is_current
      type: object
    DeviceList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DeviceList.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/DeviceItem"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    EnrolmentResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EnrolmentResponse.json
          format: uri
          readOnly: true
          type: string
        recovery_codes:
          description: Shown once.
          items:
            type: string
          maxItems: 10
          minItems: 10
          type:
            - array
            - "null"
        session:
          $ref: "#/components/schemas/SessionResponse"
      required:
        - session
        - recovery_codes
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        code:
          description: Stable, language-neutral problem code; UIs translate it.
          examples:
            - validation_failed
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      required:
        - code
      type: object
    LiveOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/LiveOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    MfaVerifyRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/MfaVerifyRequest.json
          format: uri
          readOnly: true
          type: string
        code:
          pattern: ^[0-9]{6}$
          type: string
        recovery_code:
          maxLength: 24
          minLength: 16
          type: string
      type: object
    ReauthWithCode:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ReauthWithCode.json
          format: uri
          readOnly: true
          type: string
        code:
          pattern: ^[0-9]{6}$
          type: string
        password:
          format: password
          maxLength: 1024
          minLength: 1
          type: string
      required:
        - password
        - code
      type: object
    ReauthWithCodeOrRecovery:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ReauthWithCodeOrRecovery.json
          format: uri
          readOnly: true
          type: string
        code:
          pattern: ^[0-9]{6}$
          type: string
        password:
          format: password
          maxLength: 1024
          minLength: 1
          type: string
        recovery_code:
          maxLength: 24
          minLength: 16
          type: string
      required:
        - password
      type: object
    RecoveryCodes:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RecoveryCodes.json
          format: uri
          readOnly: true
          type: string
        recovery_codes:
          items:
            type: string
          maxItems: 10
          minItems: 10
          type:
            - array
            - "null"
      required:
        - recovery_codes
      type: object
    RefreshRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RefreshRequest.json
          format: uri
          readOnly: true
          type: string
        device_id:
          format: uuid
          type: string
        refresh_token:
          description: Mobile only. Omit for web (the cookie is used).
          maxLength: 128
          type: string
      required:
        - device_id
      type: object
    SessionResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SessionResponse.json
          format: uri
          readOnly: true
          type: string
        access_token:
          type: string
        access_token_expires_at:
          format: date-time
          type: string
        idle_expires_at:
          format: date-time
          type: string
        refresh_token:
          description: Only for client_type mobile (drt_...). Web sessions get an HttpOnly cookie instead.
          type: string
        session_expires_at:
          description: Absolute expiry.
          format: date-time
          type: string
        session_id:
          format: uuid
          type: string
        token_type:
          enum:
            - Bearer
          type: string
        user:
          $ref: "#/components/schemas/SessionUser"
      required:
        - access_token
        - token_type
        - access_token_expires_at
        - session_id
        - session_expires_at
        - idle_expires_at
        - user
      type: object
    SessionUser:
      additionalProperties: false
      properties:
        email:
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        role:
          enum:
            - admin
            - client
          type: string
      required:
        - id
        - role
        - name
        - email
      type: object
    SignInRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SignInRequest.json
          format: uri
          readOnly: true
          type: string
        client_type:
          description: "mobile: the refresh token is in the body. web: only in an HttpOnly cookie."
          enum:
            - mobile
            - web
          type: string
        device:
          $ref: "#/components/schemas/DeviceInfoRequest"
        identifier:
          description: Email, or an Indian mobile number in any accepted form.
          maxLength: 320
          minLength: 1
          type: string
        password:
          format: password
          maxLength: 1024
          minLength: 1
          type: string
      required:
        - identifier
        - password
        - client_type
        - device
      type: object
    SignInResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SignInResponse.json
          format: uri
          readOnly: true
          type: string
        challenge:
          $ref: "#/components/schemas/ChallengeResponse"
          description: Present when next_step is mfa_required or mfa_enrolment_required.
        next_step:
          enum:
            - signed_in
            - mfa_required
            - mfa_enrolment_required
          type: string
        session:
          $ref: "#/components/schemas/SessionResponse"
          description: Present when next_step is signed_in.
      required:
        - next_step
      type: object
    Status:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Status.json
          format: uri
          readOnly: true
          type: string
        database:
          description: Database connectivity
          enum:
            - ok
            - unreachable
          type: string
        status:
          description: Overall status
          enum:
            - ok
            - degraded
          type: string
        time:
          description: Server time (UTC)
          format: date-time
          type: string
        version:
          description: Build version
          type: string
      required:
        - status
        - database
        - version
        - time
      type: object
    TotpCodeRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/TotpCodeRequest.json
          format: uri
          readOnly: true
          type: string
        code:
          pattern: ^[0-9]{6}$
          type: string
      required:
        - code
      type: object
    TotpSecret:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/TotpSecret.json
          format: uri
          readOnly: true
          type: string
        otpauth_uri:
          description: otpauth://totp/Swastik:<email>?secret=...&issuer=Swastik&algorithm=SHA1&digits=6&period=30
          type: string
        secret:
          description: Base32, shown once.
          type: string
      required:
        - secret
        - otpauth_uri
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
    mfaChallenge:
      bearerFormat: opaque
      scheme: bearer
      type: http
info:
  description: Internal IPO operations platform.
  title: Swastik API
  version: dev
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: health-live
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security: []
      summary: Liveness probe
      tags:
        - Health
  /readyz:
    get:
      operationId: health-ready
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security: []
      summary: Readiness probe (checks the database)
      tags:
        - Health
  /v1/admin/users/{userId}/devices:
    get:
      operationId: auth-admin-user-devices-list
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer:
            - admin
      summary: List a user's live device sessions
      tags:
        - Admin users
  /v1/admin/users/{userId}/devices/{sessionId}:
    delete:
      operationId: auth-admin-user-device-revoke
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            format: uuid
            type: string
        - in: path
          name: sessionId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer:
            - admin
      summary: End one device session of a user
      tags:
        - Admin users
  /v1/admin/users/{userId}/sessions/end-all:
    post:
      operationId: auth-admin-user-sessions-end-all
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer:
            - admin
      summary: End every session of a user
      tags:
        - Admin users
  /v1/auth/devices:
    get:
      operationId: auth-devices-list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List the caller's live device sessions
      tags:
        - Auth
  /v1/auth/devices/{sessionId}:
    delete:
      operationId: auth-device-revoke
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: End one of the caller's own device sessions
      tags:
        - Auth
  /v1/auth/mfa/authenticator:
    post:
      operationId: auth-authenticator-replace-start
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthWithCodeOrRecovery"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSecret"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer:
            - admin
      summary: Start replacing the authenticator
      tags:
        - Auth
  /v1/auth/mfa/authenticator/confirm:
    post:
      operationId: auth-authenticator-replace-confirm
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer:
            - admin
      summary: Confirm the new authenticator
      tags:
        - Auth
  /v1/auth/mfa/enrolment:
    post:
      operationId: auth-mfa-enrolment-start
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSecret"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - mfaChallenge: []
      summary: Start enrolling an authenticator
      tags:
        - Auth
  /v1/auth/mfa/enrolment/confirm:
    post:
      operationId: auth-mfa-enrolment-confirm
      parameters:
        - description: "Required for web requests: must equal an allowed admin panel origin."
          in: header
          name: Origin
          schema:
            description: "Required for web requests: must equal an allowed admin panel origin."
            type: string
        - description: "Required for web requests: must be 1."
          in: header
          name: X-Swastik-CSRF
          schema:
            description: "Required for web requests: must be 1."
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrolmentResponse"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - mfaChallenge: []
      summary: Confirm the authenticator and open the admin session
      tags:
        - Auth
  /v1/auth/mfa/recovery-codes:
    post:
      operationId: auth-recovery-codes-regenerate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthWithCode"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer:
            - admin
      summary: Replace the recovery codes
      tags:
        - Auth
  /v1/auth/mfa/verify:
    post:
      operationId: auth-mfa-verify
      parameters:
        - description: "Required for web requests: must equal an allowed admin panel origin."
          in: header
          name: Origin
          schema:
            description: "Required for web requests: must equal an allowed admin panel origin."
            type: string
        - description: "Required for web requests: must be 1."
          in: header
          name: X-Swastik-CSRF
          schema:
            description: "Required for web requests: must be 1."
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaVerifyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - mfaChallenge: []
      summary: Complete an admin sign-in with a TOTP or recovery code
      tags:
        - Auth
  /v1/auth/password/change:
    post:
      operationId: auth-password-change
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Change the caller's password
      tags:
        - Auth
  /v1/auth/refresh:
    post:
      operationId: auth-refresh
      parameters:
        - description: "Required for web requests: must equal an allowed admin panel origin."
          in: header
          name: Origin
          schema:
            description: "Required for web requests: must equal an allowed admin panel origin."
            type: string
        - description: "Required for web requests: must be 1."
          in: header
          name: X-Swastik-CSRF
          schema:
            description: "Required for web requests: must be 1."
            type: string
        - description: The refresh token of a web session.
          in: cookie
          name: __Secure-swastik_rt
          schema:
            description: The refresh token of a web session.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security: []
      summary: Rotate the refresh token and get a new access token
      tags:
        - Auth
  /v1/auth/sign-in:
    post:
      operationId: auth-sign-in
      parameters:
        - description: "Required for web requests: must equal an allowed admin panel origin."
          in: header
          name: Origin
          schema:
            description: "Required for web requests: must equal an allowed admin panel origin."
            type: string
        - description: "Required for web requests: must be 1."
          in: header
          name: X-Swastik-CSRF
          schema:
            description: "Required for web requests: must be 1."
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponse"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security: []
      summary: Sign in with email or mobile and password
      tags:
        - Auth
  /v1/auth/sign-out:
    post:
      operationId: auth-sign-out
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: End this session
      tags:
        - Auth
  /v1/auth/sign-out-everywhere:
    post:
      operationId: auth-sign-out-everywhere
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: End every session of the caller, this one included
      tags:
        - Auth
